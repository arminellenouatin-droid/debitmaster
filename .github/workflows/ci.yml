name: CI

on:
  push:
    branches: [main, 'arena/**']
  pull_request:

jobs:
  web:
    name: Web — lint & build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npx tsc -b
      - run: npm run build

  sql:
    name: SQL — validation syntaxe migrations
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Vérifier la présence des migrations ordonnées
        run: |
          ls supabase/migrations/0001_schema.sql
          ls supabase/migrations/0002_seed.sql
          ls supabase/migrations/0003_rls_functions.sql
          ls supabase/migrations/0004_operations.sql
